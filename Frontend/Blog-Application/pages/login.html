<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Log in to your BlogSpace account.">

    <title>BlogSpace</title>

    <link rel="stylesheet" href="../css/login.css">
</head>

<body class="auth-page">

    <main class="auth-main">
        <div class="auth-decoration decoration-one"></div>
        <div class="auth-decoration decoration-two"></div>

        <section class="auth-card" aria-labelledby="login-title">

            <h1 id="login-title">Login</h1>

            <p class="auth-description">
                Welcome back! Please enter your details.
            </p>

            <form id="login-form" class="auth-form" action="#" method="post">

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email" autocomplete="email"
                        required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password"
                        autocomplete="current-password" required>
                </div>

                <button type="submit" class="auth-submit">
                    Login
                </button>

            </form>

            <p class="auth-switch">
                Don't have an account?
            </p>

            <a href="register.html" class="register-auth-btn">
                Register
            </a>

        </section>
    </main>

    <script src="../js/auth.js"></script>

</body>

</html>
