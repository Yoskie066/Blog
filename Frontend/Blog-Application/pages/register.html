<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Create your BlogSpace account.">

    <title>BlogSpace</title>

    <link rel="stylesheet" href="../css/register.css">
</head>

<body class="auth-page">

    <main class="auth-main">
        <div class="auth-decoration decoration-one"></div>
        <div class="auth-decoration decoration-two"></div>

        <section class="auth-card" aria-labelledby="register-title">

            <h1 id="register-title">Register</h1>

            <p class="auth-description">
                Create your account to get started.
            </p>

            <form id="register-form" class="auth-form" action="#" method="post">

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email" autocomplete="email"
                        required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password"
                        autocomplete="new-password" required>
                </div>

                <div class="form-group">
                    <label for="confirm-password">Confirm Password</label>
                    <input type="password" id="confirm-password" name="confirmPassword"
                        placeholder="Confirm your password" autocomplete="new-password" required>
                </div>

                <button type="submit" class="auth-submit">
                    Register
                </button>

            </form>

            <p class="auth-switch">
                Already have an account?
            </p>

            <a href="login.html" class="login-auth-btn">
                Login
            </a>

        </section>
    </main>

    <script src="../js/auth.js"></script>

</body>

</html>
